<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 14px 16px;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 13px;
      color: #333;
    }
    #app-title {
      font-size: 14px;
      font-weight: 600;
      margin: 0 0 10px;
    }
    #video-title {
      font-size: 13px;
      line-height: 1.4;
      margin: 0 0 4px;
      word-break: break-all;
      max-height: 3.9em;
      overflow: hidden;
    }
    #video-size {
      font-size: 12px;
      color: #888;
      margin: 0 0 10px;
    }
    #status {
      font-size: 12px;
      line-height: 1.5;
      margin: 0 0 10px;
      word-break: break-all;
    }
    .status-error { color: #d93025; }
    .status-info { color: #555; }
    .status-ok { color: #1a7f37; }
    #download-btn {
      display: block;
      width: 100%;
      padding: 8px 0;
      border: none;
      border-radius: 6px;
      background: #ff2442;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    #download-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h1 id="app-title">RED 视频下载助手</h1>
  <p id="video-title" hidden></p>
  <p id="video-size" hidden></p>
  <p id="status" class="status-info">检测中…</p>
  <button id="download-btn" disabled>下载</button>
  <script src="popup.js"></script>
</body>
</html>
